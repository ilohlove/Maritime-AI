[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "maritime-ai-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0", "uvicorn==0.38.0", "pydantic==2.12.3",
  "SQLAlchemy==2.0.44", "alembic==1.17.1",
  "openai==2.54.0", "pypdf==6.21.4"
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
